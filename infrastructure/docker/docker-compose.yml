# Vietinė kūrimo aplinka: PostgreSQL duomenų bazė backend'ui.
# Paleidimas iš repozitorijos šaknies:  docker compose -f infrastructure/docker/docker-compose.yml up -d
name: saskaitu-agentas

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saskaitu_agentas
      POSTGRES_USER: saskaitu_agentas
      POSTGRES_PASSWORD: saskaitu_agentas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saskaitu_agentas -d saskaitu_agentas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
